name: Update tt-services dependency
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: update-tt-services
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Update manifest and lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/update-services.ts
          bun install --ignore-scripts
      - name: Validate candidate
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run build
          bunx playwright install --with-deps chromium webkit
          bun run test:editor:browser
          bun run test:frontend:browser
      - name: Open an update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if git diff --quiet -- package.json bun.lock; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B automation/update-tt-services
          git add package.json bun.lock
          git commit -m 'Update tt-services and its lockfile'
          git fetch origin automation/update-tt-services || true
          git push --force-with-lease origin automation/update-tt-services
          if [ -z "$(gh pr list --head automation/update-tt-services --state open --json number --jq '.[0].number // empty')" ]; then
            cat > /tmp/pr-body.md <<'BODY'
          Update the pinned tt-services revision together with bun.lock. Keep the compatibility patch bound to the new revision; patch conflicts stop the update for review.

          Validated with lint, typechecking, unit tests, production build, and browser editor/frontend tests.
          BODY
            gh pr create --base main --head automation/update-tt-services --title 'Update tt-services' --body-file /tmp/pr-body.md
          fi
